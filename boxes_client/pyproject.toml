[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "boxes-client"
version = "0.1.0"
description = "Thin Python client to call deployed AI 'boxes' (gRPC services) by IP:port"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "grpcio>=1.50",
    "protobuf>=4.21",
    "grpcio-reflection>=1.50",
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
# Optional: heavy-payload decoding (tapnext/vggt use torch.save). Without this,
# those fields come back as raw bytes.
torch = [
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
