# YOLO box — stateless object detection on images and videos.
# Authoritative request shape: ../../images/yolo/README.md
id: yolo
name: "YOLO · object detection (images & video)"
box_key: yolo
docs: ../../images/yolo/README.md
note: >
  Stateless: one call detects over every frame you send. Send image files
  (or a video — frames are extracted in your browser) for client-side frame
  delivery, or upload a raw video file and the box decodes it server-side.
  The panel leads with the annotated **video** (video input) and the
  detections table; per-frame annotated JPEGs have no inline grid — they
  stay in the artifacts list / raw JSON.

inputs:
  - field: images
    widget: video_frames
    kind: bb
    multiple: true
    required: false
    helper: >
      image files, or a video (mp4/webm/mov) whose frames are extracted in
      your browser and sent as images.
  - field: video
    widget: file_upload
    kind: b
    multiple: false
    required: false
    helper: >
      raw video file (mp4/avi/webm/mov) — the box decodes it server-side
      (see frame_step / max_frames). Send either this or images, not both.

command:
  values: [detect, reset]
  default: detect

parameters:
  - key: weights
    widget: select
    values: ["yolov8n.pt", "yolov8s.pt", "yolov8m.pt", "yolov11n.pt", "yolov11s.pt"]
    default: "yolov8n.pt"
    placeholder: "fresh checkpoints download on first use (see box README for paths/URLs)"
  - key: conf
    widget: slider
    min: 0.0
    max: 1.0
    step: 0.05
    default: 0.25
  - key: iou
    widget: slider
    min: 0.0
    max: 1.0
    step: 0.05
    default: 0.7
  - key: imgsz
    widget: select
    values: ["320", "416", "640", "960"]
    default: "640"
  - key: classes
    widget: tags
    placeholder: "class ids to keep (e.g. 16 = dog); empty = all classes"
  - key: save_annotated
    widget: select
    values: ["true", "false"]
    default: "true"
  - key: frame_step
    widget: number
    default: 1
    placeholder: "video: sample every Nth frame"
  - key: max_frames
    widget: number
    default: 128
    placeholder: "video: safety cap on decoded frames"

results:
  # Video input first: one annotated mp4 (source fps, H.264) is the view.
  # The per-frame JPEGs (``annotated``) get no dedicated block — they fall
  # to the ``*`` wildcard and stay reachable via the artifacts list.
  - field: annotated_video
    visualizer: video
    caption: "annotated video (video input only; source fps, H.264)"
  - field: detections
    visualizer: table
    caption: "per-frame detections (boxes xyxy, class id, label, score)"
  - field: "*"
    visualizer: json
