# TAPNext tracker — stateful, multi-session.
# Authoritative request shape: ../../images/tapnext_tracker/README.md
id: tapnext
name: "TAPNext · point tracking"
box_key: tapnext
docs: ../../images/tapnext_tracker/README.md
input_mosaic: false   # the tracks player already shows the input frames overlaid; the mosaic is redundant
note: >
  Send one frame per call; the box accumulates state across calls within a
  session. Never auto-reset (would kill the sequence): use the explicit
  "reset" command or the session actions.

inputs:
  - field: images
    widget: video_frames
    kind: bb
    multiple: true
    required: true
    helper: >
      send a video (mp4/webm/mov) — frames are extracted in your browser and
      uploaded as images — or plain image files. Extracted frames are sent in
      order; the box tracks them as one sequence in this session.
    constraint: "the box wants a list (even single frame); send one frame per call for tracking — the box accumulates state across calls"

command:
  values: [track, reset, list]
  default: track

parameters:
  - key: grid_size
    widget: slider
    min: 4
    max: 64
    step: 2
    default: 32

session:
  key: session_id
  auto_generate: true
  actions: [reset, list]
  note: >
    Opaque capability string — anyone who knows it can drive that session.
    Sessions are reaped after TAPNEXT_SESSION_TTL idle time (default 1800 s).

results:
  - field: tracks
    visualizer: tensor
    caption: "(frames, points, 2) track coordinates"
  - field: visibles
    visualizer: tensor
    caption: "(frames, points) visibility flags"
  - field: "*"
    visualizer: tracks_player
    inputs:
      frame: images
      tracks: tracks
      visibles: visibles
