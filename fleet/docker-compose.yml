name: boxes-fleet

# Launch a bunch of boxes (prebuilt images from GitHub Container Registry)
# side by side, all on the shared `pipeline.PipelineService` interface, each
# on its own host port.
#
#   docker compose up -d          # start the fleet (docker pull ghcr.io/…)
#   docker compose ps             # watch them come up
#   python hello.py               # reach every box with ONE generic pattern
#   docker compose down           # tear it down
#
# Image versions: `:latest` follows the last published `boxes-v*` tag. For a
# fully reproducible fleet, replace each tag with the immutable digest from
# the `report digests` job of the publish workflow, e.g.
#   ghcr.io/manel-ferreira-01/clip@sha256:…
#
# All boxes listen on 8061 internally; we map distinct host ports (906x).
# GPU: each box requests the nvidia devices. To run the fleet on a CPU-only
# host, delete the shared `gpu` block below -- the boxes will simply start on
# CPU and degrade gracefully (slower).

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:

  clip:
    <<: *gpu
    image: ghcr.io/manel-ferreira-01/clip:latest
    container_name: box-clip
    ports: ["9061:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  textembedding:
    <<: *gpu
    image: ghcr.io/manel-ferreira-01/textembedding:latest
    container_name: box-textembedding
    ports: ["9062:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  tapnext:
    <<: *gpu
    image: ghcr.io/manel-ferreira-01/tapnext_tracker:latest
    container_name: box-tapnext
    ports: ["9063:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  lang_segm:
    <<: *gpu
    image: ghcr.io/manel-ferreira-01/lang_segm:latest
    container_name: box-lang_sam
    ports: ["9064:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  opencv:
    <<: *gpu
    image: ghcr.io/manel-ferreira-01/opencv_box:latest
    container_name: box-opencv
    ports: ["9065:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  # Heaviest pull in the ~12 GB image (1B weights baked in at build time).
  # Skip it with `docker compose up -d <names...>` if you don't need 3D.
  vggt:
    <<: *gpu
    image: ghcr.io/manel-ferreira-01/vggt:latest
    container_name: box-vggt
    ports: ["9066:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  # MoGe-3 monocular geometry — CUDA-only box (it rejects CPU inference).
  moge:
    <<: *gpu
    image: ghcr.io/manel-ferreira-01/moge_box:latest
    container_name: box-moge
    ports: ["9067:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  # YOLOv11 detection & tracking — shared envelope (`detect` / `track` /
  # `reset` commands; stateful tracker in track mode).
  yolo:
    <<: *gpu
    image: ghcr.io/manel-ferreira-01/yologpt:latest
    container_name: box-yolo
    ports: ["9068:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped
